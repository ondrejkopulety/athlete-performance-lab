server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Payload dashboardu je ~300 kB JSONu; bez komprese to je zbytečná zátěž.
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    # Dashboard nemá být v indexu vyhledávačů ani v cizím iframe.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Docker DNS a proměnná v proxy_pass: bez toho si nginx přeloží adresu
    # API jen jednou při startu – spadl by, kdyby se `api` startovalo pomaleji,
    # a po jeho přebuildování by držel starou IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API běží na stejném originu – frontend i backend jsou pak jedna
    # aplikace v Authentiku a odpadá CORS.
    location /api/ {
        set $api http://api:8000;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ruční sync přes POST /api/sync/run se vrací hned, ale ať se
        # nezabije dlouhý dotaz nad celou historií.
        proxy_read_timeout 120s;
    }

    # Sondy pro Traefik/monitoring, ať nemusí procházet přes SPA.
    location = /api/health {
        set $api_health http://api:8000;
        proxy_pass $api_health/health;
        access_log off;
    }

    # Vite dává souborům hash v názvu – můžou se cachovat natrvalo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html se nikdy necachuje, jinak by po deploy zůstal starý build.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
